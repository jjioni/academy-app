<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>아카데미 시간표 · 대시보드</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="app-shell">
  <div class="sidebar">
    <div class="brand">아카데미</div>
    <div class="role-badge" id="roleBadge">-</div>
    <nav id="nav"></nav>
    <div class="logout"><button class="btn ghost block" id="logoutBtn">로그아웃</button></div>
  </div>
  <div class="main" id="main">
    <div id="notifBanner"></div>
    <div id="content"></div>
  </div>
</div>

<script>
let ME = null;
let REGIONS = [];
const WEEKDAYS = ['일','월','화','수','목','금','토'];
const STATUSES = ['출석','보강','지각','조퇴','병결','행사','결석'];
const LEVELS = ['1Lv(베이직)','2Lv(베이직)','3Lv(우먼)','4Lv(맨즈)'];

async function api(path, opts) {
  const res = await fetch('/api' + path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts));
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || '요청 실패');
  return data;
}

function esc(s) { return (s === undefined || s === null) ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const ROLE_LABEL = { master: '마스터', region_rep: '지역대표', admin: '관리자', instructor: '강사', student: '수강생' };
function canApprove() { return ['master','region_rep','admin'].includes(ME.role); }
function canEditTimetable() { return ['master','region_rep','admin'].includes(ME.role); }
function canManagePayments() { return ['master','region_rep','admin'].includes(ME.role); }
function canCreateAssignment() { return ['master','region_rep','admin','instructor'].includes(ME.role); }
function canCheckAttendance() { return ['master','region_rep','admin','instructor'].includes(ME.role); }

const TABS = [
  { key: 'timetable', label: '시간표' },
  { key: 'attendance', label: '출석' },
  { key: 'stats', label: '출석 통계', show: () => ME.role !== 'student' },
  { key: 'feedback', label: '피드백' },
  { key: 'assignments', label: '과제(선물)' },
  { key: 'payments', label: '결제관리' },
  { key: 'approvals', label: '승인관리', show: () => canApprove() },
  { key: 'timetable-admin', label: '시간표 관리', show: () => canEditTimetable() },
  { key: 'account', label: '내 정보' },
];

function renderNav(activeKey) {
  const nav = document.getElementById('nav');
  nav.innerHTML = TABS.filter(t => !t.show || t.show()).map(t =>
    `<a href="#${t.key}" class="${t.key===activeKey?'active':''}" data-key="${t.key}">${t.label}</a>`
  ).join('');
}

async function boot() {
  const me = await api('/me');
  if (!me.user) { location.href = '/index.html'; return; }
  ME = me.user;
  document.getElementById('roleBadge').textContent = `${ROLE_LABEL[ME.role]} · ${esc(ME.name)}`;
  const regionsRes = await api('/regions');
  REGIONS = regionsRes.regions;
  document.getElementById('logoutBtn').onclick = async () => { await api('/logout', { method: 'POST' }); location.href = '/index.html'; };
  window.onhashchange = route;
  route();
  loadNotifBanner();
}

function route() {
  const key = (location.hash || '#timetable').slice(1);
  renderNav(key);
  const map = {
    timetable: renderTimetable, attendance: renderAttendance, stats: renderStats,
    feedback: renderFeedback, assignments: renderAssignments, payments: renderPayments,
    approvals: renderApprovals, 'timetable-admin': renderTimetableAdmin, account: renderAccount
  };
  (map[key] || renderTimetable)();
}

async function loadNotifBanner() {
  try {
    const { notifications } = await api('/notifications/assignments');
    const box = document.getElementById('notifBanner');
    if (!notifications.length) { box.innerHTML = ''; return; }
    box.innerHTML = `<div class="notif-banner">📌 마감 임박 과제: ` +
      notifications.map(n => `<b>${esc(n.title)}</b>(${n.dDay === 0 ? '오늘 마감' : 'D-' + n.dDay})`).join(', ') + `</div>`;
  } catch (e) {}
}

// ===================== 시간표 =====================
let ttState = { year: new Date().getFullYear(), month: new Date().getMonth() + 1, showInternal: false, regionId: REGIONS[0] ? REGIONS[0].id : '' };

async function renderTimetable() {
  const content = document.getElementById('content');
  content.innerHTML = `<div class="page-title">아카데미 시간표</div><div class="page-sub">월별 시간표 · 내부일정 토글로 운영진 일정도 함께 확인</div>`;
  const card = document.createElement('div'); card.className = 'card';
  const regionOpts = REGIONS.map(r => `<option value="${r.id}" ${String(r.id)===String(ttState.regionId)?'selected':''}>${esc(r.name)}</option>`).join('');
  card.innerHTML = `
    <div class="month-nav">
      <button class="btn small ghost" id="prevM">‹</button>
      <div class="label" id="monthLabel"></div>
      <button class="btn small ghost" id="nextM">›</button>
      <select id="regionSel" style="margin-left:12px">${regionOpts}</select>
      <label class="check-toggle"><input type="checkbox" id="internalToggle" ${ttState.showInternal?'checked':''}/> 내부일정 보기</label>
    </div>
    <div class="month-grid" id="grid"></div>
  `;
  content.appendChild(card);
  document.getElementById('monthLabel').textContent = `${ttState.year}년 ${ttState.month}월`;
  document.getElementById('prevM').onclick = () => { ttState.month--; if (ttState.month < 1) { ttState.month = 12; ttState.year--; } renderTimetable(); };
  document.getElementById('nextM').onclick = () => { ttState.month++; if (ttState.month > 12) { ttState.month = 1; ttState.year++; } renderTimetable(); };
  document.getElementById('regionSel').onchange = (e) => { ttState.regionId = e.target.value; renderTimetable(); };
  document.getElementById('internalToggle').onchange = (e) => { ttState.showInternal = e.target.checked; renderTimetable(); };

  const { days } = await api(`/timetable/month?year=${ttState.year}&month=${ttState.month}&regionId=${ttState.regionId}&showInternal=${ttState.showInternal}`);
  const grid = document.getElementById('grid');
  const dowHtml = WEEKDAYS.map(w => `<div class="dow">${w}</div>`).join('');
  const firstDow = new Date(ttState.year, ttState.month - 1, 1).getDay();
  const blanks = Array(firstDow).fill('<div></div>').join('');
  const todayStr = new Date().toISOString().slice(0,10);
  const cellsHtml = days.map(d => {
    const items = d.items.map(it => {
      const cls = it.isInternal ? 'internal' : '';
      const label = it.title || it.level || '';
      return `<div class="day-item ${cls}" title="${esc(label)} ${esc(it.startTime||'')}-${esc(it.endTime||'')} ${esc(it.room||'')}" onclick="openAttendanceFor('${it.instanceKey}','${d.date}')">${esc(label)}<br><span class="muted">${esc(it.startTime||'')} ${esc(it.room||'')}</span></div>`;
    }).join('');
    return `<div class="day-cell ${d.date===todayStr?'today':''}"><div class="date-num">${Number(d.date.slice(8,10))}</div>${items}</div>`;
  }).join('');
  grid.innerHTML = dowHtml + blanks + cellsHtml;
}

function openAttendanceFor(instanceKey, date) {
  location.hash = 'attendance';
  setTimeout(() => { window._pendingInstanceKey = instanceKey; renderAttendance(); }, 30);
}

// ===================== 출석 =====================
async function renderAttendance() {
  const content = document.getElementById('content');
  content.innerHTML = `<div class="page-title">출석</div><div class="page-sub">교시별 출석 체크 (${STATUSES.join(' / ')})</div>`;

  if (ME.role === 'student') return renderAttendanceStudent(content);

  if (!canCheckAttendance()) { content.innerHTML += `<div class="card">권한이 없습니다.</div>`; return; }

  const { days } = await api(`/timetable/month?year=${ttState.year}&month=${ttState.month}&regionId=${ttState.regionId||REGIONS[0].id}&showInternal=false`);
  const allItems = [];
  days.forEach(d => d.items.forEach(it => allItems.push(Object.assign({}, it, { date: d.date }))));
  const picked = window._pendingInstanceKey ? allItems.find(i => i.instanceKey === window._pendingInstanceKey) : allItems[0];

  const card = document.createElement('div'); card.className = 'card';
  const opts = allItems.map(it => `<option value="${it.instanceKey}" ${picked && picked.instanceKey===it.instanceKey?'selected':''}>${it.date} ${esc(it.title||it.level)}</option>`).join('');
  card.innerHTML = `
    <h3>출석 체크할 수업 선택</h3>
    <select id="classSel" style="min-width:280px">${opts}</select>
    <div id="attBody" class="mt16"></div>
  `;
  content.appendChild(card);
  document.getElementById('classSel').onchange = () => loadAttBody(allItems);
  if (picked) loadAttBody(allItems);
  else document.getElementById('attBody').innerHTML = '<div class="muted">이 지역/월에 등록된 수업이 없습니다.</div>';
}

async function loadAttBody(allItems) {
  const key = document.getElementById('classSel').value;
  const item = allItems.find(i => i.instanceKey === key);
  const [{ attendance }, { students }] = await Promise.all([
    api(`/attendance?instanceKey=${encodeURIComponent(key)}`),
    api(`/students?status=active${item.level ? '&level=' + encodeURIComponent(item.level) : ''}`)
  ]);
  const periods = [1, 2, 3];
  const body = document.getElementById('attBody');
  body.innerHTML = `
    <div class="row mb8">
      <button class="btn small" onclick="genCheckinCode('${key}')">체크인 코드 발급 (1분 유효)</button>
      <span id="codeDisplay"></span>
    </div>
    <table>
      <thead><tr><th>수강생</th>${periods.map(p => `<th>${p}교시</th>`).join('')}<th>수업 후 피드백</th></tr></thead>
      <tbody>
        ${students.map(s => `
          <tr>
            <td>${esc(s.name)}</td>
            ${periods.map(p => {
              const rec = attendance.find(a => a.studentId === s.id && a.period === p);
              return `<td><div class="status-btns" data-student="${s.id}" data-period="${p}">${STATUSES.map(st => `<button class="${rec && rec.status===st?'sel':''}" onclick="setAttendance('${key}',${p},${s.id},'${st}')">${st}</button>`).join('')}</div></td>`;
            }).join('')}
            <td><button class="btn small ghost" onclick="openFeedbackModal(${s.id}, '${key}')">피드백 작성</button></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
    <div id="feedbackModal"></div>
  `;
}

async function setAttendance(instanceKey, period, studentId, status) {
  await api('/attendance/check', { method: 'POST', body: JSON.stringify({ instanceKey, period, studentId, status }) });
  loadAttBody(window._allItemsCache || []);
  route();
}

async function genCheckinCode(instanceKey) {
  const regionId = ttState.regionId || REGIONS[0].id;
  const { code, ttlMs } = await api('/attendance/checkin-code/generate', { method: 'POST', body: JSON.stringify({ instanceKey, period: 1, regionId }) });
  const el = document.getElementById('codeDisplay');
  let remain = Math.floor(ttlMs / 1000);
  el.innerHTML = `<span class="qr-code-num" style="font-size:22px">${code}</span> <span class="muted">(${remain}초)</span>`;
  const timer = setInterval(() => {
    remain--;
    if (remain <= 0) { clearInterval(timer); el.innerHTML = '<span class="muted">코드 만료됨</span>'; return; }
    el.querySelector('.muted').textContent = `(${remain}초)`;
  }, 1000);
}

function openFeedbackModal(studentId, instanceKey) {
  const modal = document.getElementById('feedbackModal');
  modal.innerHTML = `
    <div class="card mt16">
      <h3>수업 후 개인 피드백</h3>
      <div class="field"><textarea id="fbComment" placeholder="이 수강생에 대한 피드백을 남겨주세요."></textarea></div>
      <button class="btn primary small" onclick="submitInstructorFeedback(${studentId}, '${instanceKey}')">저장</button>
    </div>
  `;
}
async function submitInstructorFeedback(studentId, instanceKey) {
  const comment = document.getElementById('fbComment').value.trim();
  if (!comment) return alert('내용을 입력하세요.');
  await api('/feedback/instructor', { method: 'POST', body: JSON.stringify({ studentId, instanceKey, comment }) });
  alert('피드백이 저장되었습니다.');
  document.getElementById('feedbackModal').innerHTML = '';
}

async function renderAttendanceStudent(content) {
  const card = document.createElement('div'); card.className = 'card';
  card.innerHTML = `
    <h3>체크인 코드로 출석하기</h3>
    <div class="field"><label>강사/관리자가 알려준 6자리 코드</label><input id="codeInput" maxlength="6" placeholder="123456" /></div>
    <button class="btn primary" id="submitCodeBtn">위치 확인 후 출석 제출</button>
    <div id="checkinMsg" class="mt8"></div>
  `;
  content.appendChild(card);
  document.getElementById('submitCodeBtn').onclick = submitCheckinCode;

  const statsCard = document.createElement('div'); statsCard.className = 'card';
  statsCard.innerHTML = `<h3>내 출결 현황</h3><div id="myStats">불러오는 중...</div>`;
  content.appendChild(statsCard);
  const { stats } = await api(`/attendance/stats?studentId=${ME.id}`);
  const s = stats[0];
  document.getElementById('myStats').innerHTML = s ? renderStatsTable([s]) : '기록이 없습니다.';
}

function submitCheckinCode() {
  const code = document.getElementById('codeInput').value.trim();
  const msg = document.getElementById('checkinMsg');
  if (!code) return;
  if (!navigator.geolocation) { msg.innerHTML = '<div class="msg error">이 브라우저는 위치 확인을 지원하지 않습니다.</div>'; return; }
  msg.innerHTML = '<div class="muted">위치 확인 중...</div>';
  navigator.geolocation.getCurrentPosition(async (pos) => {
    try {
      await api('/attendance/checkin-code/submit', { method: 'POST', body: JSON.stringify({ code, lat: pos.coords.latitude, lng: pos.coords.longitude }) });
      msg.innerHTML = '<div class="msg ok">출석 처리되었습니다.</div>';
    } catch (e) { msg.innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
  }, () => { msg.innerHTML = '<div class="msg error">위치 권한을 허용해야 출석 인증이 가능합니다.</div>'; });
}

// ===================== 출석 통계 =====================
function renderStatsTable(stats) {
  return `<table><thead><tr><th>수강생</th><th>총 수업</th>${STATUSES.map(s=>`<th>${s}</th>`).join('')}</tr></thead><tbody>
    ${stats.map(s => `<tr><td>${esc(s.student.name)}</td><td>${s.total}</td>${STATUSES.map(st => `<td>${s.percents[st]}% (${s.counts[st]})</td>`).join('')}</tr>`).join('')}
  </tbody></table>`;
}
async function renderStats() {
  const content = document.getElementById('content');
  content.innerHTML = `<div class="page-title">출석 통계</div><div class="page-sub">레벨별 필터 · 상태별 비율 및 횟수</div>`;
  const card = document.createElement('div'); card.className = 'card';
  card.innerHTML = `
    <div class="row mb8">
      <select id="levelFilter"><option value="">전체 레벨</option>${LEVELS.map(l=>`<option value="${l}">${l}</option>`).join('')}</select>
      <input id="nameFilter" placeholder="이름 검색" />
      <button class="btn small" id="applyFilter">필터 적용</button>
    </div>
    <div id="statsTable">불러오는 중...</div>
  `;
  content.appendChild(card);
  async function load() {
    const level = document.getElementById('levelFilter').value;
    const name = document.getElementById('nameFilter').value.trim();
    const { stats } = await api(`/attendance/stats${level ? '?level=' + encodeURIComponent(level) : ''}`);
    const filtered = name ? stats.filter(s => s.student.name.includes(name)) : stats;
    document.getElementById('statsTable').innerHTML = renderStatsTable(filtered);
  }
  document.getElementById('applyFilter').onclick = load;
  load();
}

// ===================== 피드백 =====================
async function renderFeedback() {
  const content = document.getElementById('content');
  content.innerHTML = `<div class="page-title">피드백</div>`;
  if (ME.role === 'student') return renderFeedbackStudent(content);

  content.innerHTML += `<div class="page-sub">강사 → 수강생 피드백 열람, 수강생 → 강사 피드백(익명) 열람</div>`;
  const { students } = await api('/students?status=active');
  const card = document.createElement('div'); card.className = 'card';
  card.innerHTML = `<h3>수강생별 강사 피드백</h3>
    <select id="studFbSel">${students.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select>
    <div id="fbList" class="mt16"></div>`;
  content.appendChild(card);
  async function loadFb() {
    const sid = document.getElementById('studFbSel').value;
    const { feedback } = await api(`/feedback/instructor?studentId=${sid}`);
    document.getElementById('fbList').innerHTML = feedback.length ? feedback.map(f => `<div class="card"><b>${esc(f.authorName)}</b> · <span class="muted">${new Date(f.createdAt).toLocaleString()}</span><div class="mt8">${esc(f.comment)}</div></div>`).join('') : '<div class="muted">피드백 없음</div>';
  }
  document.getElementById('studFbSel').onchange = loadFb;
  if (students.length) loadFb();

  if (isAtLeast_admin()) {
    const card2 = document.createElement('div'); card2.className = 'card';
    card2.innerHTML = `<h3>수강생 → 강사 피드백 (작성자 확인 가능)</h3><div id="studentToInstructor">불러오는 중...</div>`;
    content.appendChild(card2);
    const { feedback } = await api('/feedback/student');
    document.getElementById('studentToInstructor').innerHTML = feedback.length ? feedback.map(f => `
      <div class="card"><b>${esc(f.studentName || '익명')}</b> · <span class="muted">${new Date(f.createdAt).toLocaleString()}</span>
      <div class="mt8">난이도: ${esc(f.difficulty||'-')} / 분위기: ${(f.moods||[]).join(', ')||'-'}</div>
      <div class="mt8">${esc(f.comment)}</div></div>
    `).join('') : '<div class="muted">피드백 없음</div>';
  }
}
function isAtLeast_admin() { return ['master','region_rep','admin'].includes(ME.role); }

async function renderFeedbackStudent(content) {
  content.innerHTML += `<div class="page-sub">내가 받은 피드백 확인 · 강사에게 피드백 남기기 (강사에겐 익명 처리)</div>`;
  const card = document.createElement('div'); card.className = 'card';
  card.innerHTML = `<h3>내가 받은 강사/리더 피드백</h3><div id="myFb">불러오는 중...</div>`;
  content.appendChild(card);
  const { feedback } = await api(`/feedback/instructor?studentId=${ME.id}`);
  document.getElementById('myFb').innerHTML = feedback.length ? feedback.map(f => `<div class="card"><b>${esc(f.authorName)}</b> · <span class="muted">${new Date(f.createdAt).toLocaleString()}</span><div class="mt8">${esc(f.comment)}</div></div>`).join('') : '<div class="muted">아직 받은 피드백이 없습니다.</div>';

  const { staff } = await api('/staff');
  const instructors = staff.filter(s => ['instructor','admin','region_rep','master'].includes(s.role));
  const card2 = document.createElement('div'); card2.className = 'card';
  card2.innerHTML = `
    <h3>강사에게 피드백 남기기</h3>
    <div class="field"><label>강사 선택</label><select id="instrSel">${instructors.map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('')}</select></div>
    <div class="field"><label>수업 난이도 (택1)</label>
      <select id="difficultySel"><option value="어려워요">어려워요</option><option value="적당해요">적당해요</option><option value="쉬워요">쉬워요</option><option value="이해됐어요">이해됐어요</option></select>
    </div>
    <div class="field"><label>수업 분위기 (복수선택 가능)</label>
      <div class="row">
        ${['재밌어요','무서워요','빠듯해요','편안해요'].map(m=>`<label><input type="checkbox" value="${m}" class="moodChk"/> ${m}</label>`).join(' ')}
      </div>
    </div>
    <div class="field"><label>자유 코멘트</label><textarea id="fbFreeText"></textarea></div>
    <button class="btn primary" id="sendFb">제출 (선택)</button>
    <div id="fbSendMsg" class="mt8"></div>
  `;
  content.appendChild(card2);
  document.getElementById('sendFb').onclick = async () => {
    const instructorId = document.getElementById('instrSel').value;
    const difficulty = document.getElementById('difficultySel').value;
    const moods = [...document.querySelectorAll('.moodChk:checked')].map(c => c.value);
    const comment = document.getElementById('fbFreeText').value;
    await api('/feedback/student', { method: 'POST', body: JSON.stringify({ instructorId, difficulty, moods, comment }) });
    document.getElementById('fbSendMsg').innerHTML = '<div class="msg ok">제출되었습니다. (강사에게는 익명으로 전달됩니다)</div>';
  };
}

// ===================== 과제(선물) =====================
async function renderAssignments() {
  const content = document.getElementById('content');
  content.innerHTML = `<div class="page-title">과제(선물) 공지</div><div class="page-sub">레벨/요일 대상 공지 · 데드라인 D-1/D-2 알림 · 파일/링크 제출</div>`;

  if (canCreateAssignment()) {
    const createCard = document.createElement('div'); createCard.className = 'card';
    createCard.innerHTML = `
      <h3>새 과제(선물) 등록</h3>
      <div class="field"><label>제목</label><input id="aTitle" /></div>

async function submitAssignment(id, submissionType) {
  const comment = document.getElementById(`comment_${id}`).value;
  let type = 'none', content = '', fileName = '', fileData = '';
  const linkEl = document.getElementById(`link_${id}`);
  const fileEl = document.getElementById(`file_${id}`);
  if (linkEl && linkEl.value) { type = 'link'; content = linkEl.value; }
  else if (fileEl && fileEl.files[0]) {
    type = 'file';
    const file = fileEl.files[0];
    fileName = file.name;
    fileData = await new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.readAsDataURL(file);
    });
  }
  await api('/assignments/submit', { method: 'POST', body: JSON.stringify({ assignmentId: id, type, content, comment, fileName, fileData }) });
  renderAssignments();
}

const CSV_HEADER_MAP = { '이름': 'name', '휴대폰번호': 'phone', '휴대폰': 'phone', '레벨': 'level', '희망요일': 'desiredDays', '수강희망요일': 'desiredDays', '경력': 'career', '입사시기': 'joinPeriod', 'mbti': 'mbti', 'disc': 'disc' };

function parseCSV(text) {
  const lines = text.replace(/\r/g, '').split('\n').filter(l => l.trim().length);
  if (!lines.length) return [];
  const splitLine = (line) => {
    const out = []; let cur = ''; let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQuotes = !inQuotes; continue; }
      if (c === ',' && !inQuotes) { out.push(cur); cur = ''; continue; }
      cur += c;
    }
    out.push(cur);
    return out.map(s => s.trim());
  };
  const headers = splitLine(lines[0]).map(h => CSV_HEADER_MAP[h.trim()] || CSV_HEADER_MAP[h.trim().toLowerCase()] || h.trim());
  return lines.slice(1).map(line => {
    const cells = splitLine(line);
    const obj = {};
    headers.forEach((h, i) => { obj[h] = cells[i] || ''; });
    return obj;
  });
}

function handleCsvImport() {
  const fileEl = document.getElementById('csvFile');
  if (!fileEl.files[0]) return alert('CSV 파일을 선택하세요.');
  const regionId = document.getElementById('importRegion').value;
  const reader = new FileReader();
  reader.onload = async () => {
    const rows = parseCSV(reader.result);
    if (!rows.length) return alert('읽을 수 있는 데이터가 없습니다.');
    try {
      const { results } = await api('/students/bulk-import', { method: 'POST', body: JSON.stringify({ students: rows, regionId }) });
      document.getElementById('importResult').innerHTML = `<table><thead><tr><th>#</th><th>이름</th><th>아이디(휴대폰)</th><th>결과</th></tr></thead><tbody>
        ${results.map(r => `<tr><td>${r.row}</td><td>${esc(r.name)}</td><td>${esc(r.phone)}</td><td>${r.ok ? `<span class="badge active">등록완료 (초기비번 ${esc(r.tempPassword)})</span>` : `<span class="badge inactive">${esc(r.error)}</span>`}</td></tr>`).join('')}
      </tbody></table>`;
    } catch (e) { alert(e.message); }
  };
  reader.readAsText(fileEl.files[0], 'utf-8');
}

      <div class="field"><input id="newPhone" placeholder="새 아이디 (휴대폰번호 또는 원하는 문자열)" value="${esc(ME.phone)}" /></div>
      <button class="btn primary" id="changePhoneBtn">변경</button>
      <div id="phoneMsg" class="mt8"></div>
    </div>
    <div class="card">
      <h3>비밀번호 변경</h3>
      <div class="field"><input id="newPw" type="password" placeholder="새 비밀번호" /></div>
      <button class="btn primary" id="changePwBtn">변경</button>
      <div id="pwMsg" class="mt8"></div>
    </div>
  `;
  document.getElementById('changePhoneBtn').onclick = async () => {
    const newPhone = document.getElementById('newPhone').value;
    try {
      const r = await api('/change-phone', { method: 'POST', body: JSON.stringify({ newPhone }) });
      ME.phone = r.phone;
      document.getElementById('phoneMsg').innerHTML = '<div class="msg ok">변경되었습니다. 다음 로그인부터 새 아이디를 사용하세요.</div>';
      document.getElementById('roleBadge').textContent = `${ROLE_LABEL[ME.role]} · ${esc(ME.name)}`;
    } catch (e) { document.getElementById('phoneMsg').innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
  };
  document.getElementById('changePwBtn').onclick = async () => {
    const newPassword = document.getElementById('newPw').value;
    try { await api('/change-password', { method: 'POST', body: JSON.stringify({ newPassword }) }); document.getElementById('pwMsg').innerHTML = '<div class="msg ok">변경되었습니다.</div>'; }
    catch (e) { document.getElementById('pwMsg').innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
  };
}

boot();
</script>
</body>
</html>
